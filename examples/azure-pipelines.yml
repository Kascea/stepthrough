name: stepthrough-ci

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  goVersion: "1.25.4"

# Each job runs on its own fresh agent — that is why GoTool@0 appears in every
# job. On Microsoft-hosted agents the toolchain is pre-cached, so the "install"
# is really a fast version-select rather than a full download.
#
# -tags=server is required on every go command to exclude the Wails desktop
# application layer from server/CI builds. The stepthrough-agent image includes
# pkg-config, libgtk-3-dev, and libwebkit2gtk-4.0-dev so Wails CGo packages
# compile correctly without stubs, matching real Azure hosted agent capability.

stages:
  - stage: Lint
    displayName: Lint & Vet
    jobs:
      - job: Lint
        displayName: Lint and format check
        steps:
          - checkout: self
            displayName: Checkout source

          - task: GoTool@0
            displayName: Install Go $(goVersion)
            inputs:
              version: "$(goVersion)"

          - script: |
              unformatted=$(gofmt -l $(find "$BUILD_SOURCESDIRECTORY" -name '*.go' -not -path '*/frontend/*'))
              if [ -n "$unformatted" ]; then
                echo "Unformatted files:"
                echo "$unformatted"
                exit 1
              fi
              echo "All Go files are properly formatted."
            displayName: Check formatting (gofmt)

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" vet -tags=server ./...
              echo "go vet passed."
            displayName: Vet (go vet)

  - stage: Build
    displayName: Build
    dependsOn: Lint
    jobs:
      - job: Build
        displayName: Build application
        steps:
          - checkout: self
            displayName: Checkout source

          - task: GoTool@0
            displayName: Install Go $(goVersion)
            inputs:
              version: "$(goVersion)"

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" build -tags=server ./...
              echo "Build successful."
            displayName: Build (go build)

  # The two Test jobs run in parallel on separate agents.
  # Each needs its own checkout and Go install because agents share nothing.
  - stage: Test
    displayName: Test
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: Unit tests
        steps:
          - checkout: self
            displayName: Checkout source

          - task: GoTool@0
            displayName: Install Go $(goVersion)
            inputs:
              version: "$(goVersion)"

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" test -tags=server ./pipeline/... ./orchestrator/... ./service/... -v -count=1
            displayName: Unit tests

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" test -tags=server ./... -count=1 -coverprofile=coverage.out
              go -C "$BUILD_SOURCESDIRECTORY" tool cover -func=coverage.out | tail -1
            displayName: Coverage report

      - job: IntegrationTests
        displayName: Integration tests (Docker)
        steps:
          - checkout: self
            displayName: Checkout source

          - task: GoTool@0
            displayName: Install Go $(goVersion)
            inputs:
              version: "$(goVersion)"

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" test -tags=server ./runner/... -v -count=1
            displayName: Runner integration tests

  # Runs after tests, only on main, only when agent/Dockerfile changed.
  # Requires a GHCR_TOKEN secret variable set in the pipeline UI (write:packages scope).
  - stage: AgentImage
    displayName: Build & Push Agent Image
    dependsOn: Test
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: BuildPush
        displayName: Build and push stepthrough-agent
        steps:
          - checkout: self
            displayName: Checkout source

          - script: |
              if git diff --name-only HEAD~1 HEAD | grep -q '^agent/'; then
                echo "##vso[task.setvariable variable=DOCKERFILE_CHANGED]true"
                echo "agent/ changed — will build and push"
              else
                echo "##vso[task.setvariable variable=DOCKERFILE_CHANGED]false"
                echo "agent/ unchanged — skipping image build"
              fi
            displayName: Detect agent image changes

          - script: |
              echo "$(GHCR_TOKEN)" | docker login ghcr.io -u kascea --password-stdin
              ARCH=$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')
              docker buildx build \
                --platform linux/amd64,linux/arm64 \
                -t ghcr.io/kascea/stepthrough-agent:latest \
                --push \
                agent/
            displayName: Build and push agent image
            condition: eq(variables['DOCKERFILE_CHANGED'], 'true')
            env:
              GHCR_TOKEN: $(GHCR_TOKEN)

  - stage: Deploy
    displayName: Deploy to Staging
    dependsOn: Test
    jobs:
      - deployment: DeployStaging
        displayName: Deploy staging environment
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying to staging..."
                  displayName: Deploy artifact

                - script: echo "Running smoke tests..."
                  displayName: Smoke test
