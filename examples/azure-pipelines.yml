name: stepthrough-ci

trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  goVersion: "1.25.4"

stages:
  - stage: Lint
    displayName: Lint & Vet
    jobs:
      - job: Lint
        displayName: Lint and format check
        steps:
          - checkout: self
            displayName: Checkout source

          - task: GoTool@0
            displayName: Install Go
            inputs:
              version: "$(goVersion)"

          - script: go version
            displayName: Verify Go

          - script: |
              unformatted=$(gofmt -l $(find "$BUILD_SOURCESDIRECTORY" -name '*.go' -not -path '*/frontend/*'))
              if [ -n "$unformatted" ]; then
                echo "Unformatted files:"
                echo "$unformatted"
                exit 1
              fi
              echo "All Go files are properly formatted."
            displayName: Check formatting (gofmt)

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" vet -tags=server ./...
              echo "go vet passed."
            displayName: Vet (go vet)

  - stage: Build
    displayName: Build
    dependsOn: Lint
    jobs:
      - job: Build
        displayName: Build application
        steps:
          - checkout: self
            displayName: Checkout source

          - task: GoTool@0
            displayName: Install Go
            inputs:
              version: "$(goVersion)"

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" build -tags=server ./...
              echo "Build successful."
            displayName: Build (go build)

  - stage: Test
    displayName: Test
    dependsOn: Build
    jobs:
      - job: UnitTests
        displayName: Unit tests
        steps:
          - checkout: self
            displayName: Checkout source

          - task: GoTool@0
            displayName: Install Go
            inputs:
              version: "$(goVersion)"

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" test -tags=server ./pipeline/... -v -count=1
            displayName: Pipeline parser tests

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" test -tags=server ./runner/... -v -count=1
            displayName: Runner tests

          - script: |
              go -C "$BUILD_SOURCESDIRECTORY" test -tags=server ./... -count=1 -coverprofile=coverage.out
              go -C "$BUILD_SOURCESDIRECTORY" tool cover -func=coverage.out | tail -1
            displayName: Coverage report

  - stage: Deploy
    displayName: Deploy to Staging
    dependsOn: Test
    jobs:
      - deployment: DeployStaging
        displayName: Deploy staging environment
        environment: staging
        strategy:
          runOnce:
            deploy:
              steps:
                - script: echo "Deploying to staging..."
                  displayName: Deploy

                - script: echo "Running smoke tests..."
                  displayName: Smoke test
