# Source: https://github.com/namely/mockery
# Language: Go
# Exercises: GoTool@0, go test
# Note: $(modulePath) is undefined here — expands to empty string, so go test runs from the checkout root.

trigger:
  - master

pool:
  vmImage: "ubuntu-latest"

steps:
  - task: GoTool@0
    inputs:
      version: "1.13.5"

  - script: go test -v ./...
    workingDirectory: "$(modulePath)"
    displayName: "Run tests"
